[package]
name = "pewter"
version = "0.0.10"
edition = "2021"
description = "A library for reading and writing PE files"
license = "MIT"
readme = "README.md"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags = "2.13"
strum = { version = "0.28", default-features = false, features = ["derive"] }
facet = { version = "0.50.0-rc.7", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
bitflags = "2.13"

[features]
default = [ "std", "fast-rw"]
std = ["facet?/std"]
fast-rw = []
reflect = ["dep:facet"]
